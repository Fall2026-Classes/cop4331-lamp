<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COP 4331 Contacts Manager</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">

<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="alternate icon" href="favicon.ico">

<link href="css/styles.css" rel="stylesheet">

<script type="text/javascript" src="js/md5.js"></script>
<script type="text/javascript" src="js/code.js"></script>
</head>

<body class="center">

<canvas id="rain" aria-hidden="true"></canvas>

<main class="narrow">

  <!-- ========== LOGIN ========== -->
  <div class="terminal" id="loginDiv">
    <div class="titlebar">
      <span>root@ucf:~/cop4331$</span>
      <span class="status">SECURE</span>
    </div>

    <div class="pad">
      <h1 id="title">Contacts Manager<span class="caret"></span></h1>
      <p class="subtitle" id="inner-title">Sign in to your contact list</p>

      <form id="loginForm" onsubmit="event.preventDefault(); doLogin();">
        <label for="loginName">Username</label>
        <div class="field">
          <span class="prompt">&gt;</span>
          <input type="text" id="loginName" placeholder="username"
                 autocomplete="username" autocapitalize="off" spellcheck="false" required>
        </div>

        <label for="loginPassword">Password</label>
        <div class="field">
          <span class="prompt">&gt;</span>
          <input type="password" id="loginPassword" placeholder="password"
                 autocomplete="current-password" required>
        </div>

        <button type="submit" id="loginButton" class="block">SIGN IN</button>
      </form>

      <span id="loginResult" class="result"></span>

      <p class="footnote">
        No account yet?
        <button type="button" class="ghost" onclick="showPanel('register');">Create one</button>
      </p>
    </div>
  </div>

  <!-- ========== REGISTER ========== -->
  <div class="terminal" id="registerDiv" style="display:none;">
    <div class="titlebar">
      <span>root@ucf:~/cop4331$ useradd</span>
      <span class="status">NEW</span>
    </div>

    <div class="pad">
      <h1>Create an account<span class="caret"></span></h1>
      <p class="subtitle">Your contacts are private to your login</p>

      <form id="registerForm" onsubmit="event.preventDefault(); doRegister();">
        <div class="grid2">
          <div>
            <label for="regFirstName">First name</label>
            <div class="field">
              <span class="prompt">&gt;</span>
              <input type="text" id="regFirstName" placeholder="first name">
            </div>
          </div>
          <div>
            <label for="regLastName">Last name</label>
            <div class="field">
              <span class="prompt">&gt;</span>
              <input type="text" id="regLastName" placeholder="last name">
            </div>
          </div>
        </div>

        <label for="regUsername">Username</label>
        <div class="field">
          <span class="prompt">&gt;</span>
          <input type="text" id="regUsername" placeholder="pick a username"
                 autocapitalize="off" spellcheck="false" required>
        </div>

        <label for="regPassword">Password</label>
        <div class="field">
          <span class="prompt">&gt;</span>
          <input type="password" id="regPassword" placeholder="pick a password"
                 autocomplete="new-password" required>
        </div>

        <button type="submit" id="registerButton" class="block">CREATE ACCOUNT</button>
      </form>

      <span id="registerResult" class="result"></span>

      <p class="footnote">
        Already registered?
        <button type="button" class="ghost" onclick="showPanel('login');">Sign in</button>
      </p>
    </div>
  </div>

</main>

</body>
</html>
